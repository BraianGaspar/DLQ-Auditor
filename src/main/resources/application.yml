spring:
  application:
    name: servico-auditor-dlq

  datasource:
    url: jdbc:h2:mem:auditdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    stack:
      auto: false

sqs:
  dlq:
    name: ${SQS_DLQ_NAME}

logging:
  level:
    com.auditor.dlq: INFO
    io.awspring.cloud: INFO
    software.amazon.awssdk: INFO
